name: Continues Integration

on: [push]

jobs:
  buildAndLint:
    name: Build & Lint
    runs-on: ubuntu-stepsecurity-x64
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Use Node.js 16.10
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: "16.10"
      - name: Install
        run: yarn install --frozen-lockfile --ignore-optional
      - name: Verify that the plugin metadta is correct
        run: yarn verify-package-metadata
      - name: Prettier validate
        run: yarn prettier:check
      - name: Lint
        run: yarn lint
      - name: Get Chat Version
        id: get_chat_version
        run: echo "version=$(cat ./.chatversion)" >> $GITHUB_ENV
      - name: Checkout Chat Application Repository
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
        with:
          repo: "codota/tabnine-chat-app"
          version: "tags/${{ env.version }}"
          file: "build.tar.gz"
          token: ${{ secrets.GH_BUILDER_TOKEN }}
      - name: Extract Chat App Build
        run: |
          mkdir -p ./chat
          tar -xzvf ./build.tar.gz -C ./chat
      - name: Package
        run: yarn vsce:package

  test:
    name: Test
    runs-on: ubuntu-stepsecurity-x64
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Use Node.js 16.10
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: "16.10"
      - name: Install
        run: yarn install --frozen-lockfile --ignore-optional
      - run: xvfb-run -a yarn test
        if: runner.os == 'Linux'
      - run: yarn test
        if: runner.os != 'Linux'
